<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Emotion Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='62' font-size='62' text-anchor='middle' fill='%23ffffff' font-family='Inter, sans-serif'>E</text></svg>">
</head>
<body>
    <header class="header">
        <h1>Emotion Recognition</h1>
        <div class="header-actions">
            {% if session.get('user') %}
            <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
            {% endif %}
            <button class="theme-toggle" onclick="toggleTheme()">
                🌙 Dark Mode
            </button>
        </div>
    </header>

    <div class="auth-page">
        <h1>Register</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="/signup">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="password" name="password" placeholder="Create a password" required>
            <input type="password" name="confirm_password" placeholder="Confirm password" required>
            <button type="submit" class="button">Create Account</button>
        </form>

        <div class="oauth-divider"><span>or</span></div>
        <button type="button" id="google-login" class="button google-button" {% if not google_login_enabled %}disabled{% endif %}>
            Continue with Google
        </button>
        <div id="google-login-message" class="auth-message" style="display: none;"></div>

        <p>
            Already have an account?
            <a href="/login">Sign in here</a>
        </p>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Emotion Recognition System. Built by AI Engineering Team</p>
    </footer>

    <script>
        window.firebaseWebConfig = {{ firebase_web_config | tojson }};
        window.googleLoginUrl = "{{ url_for('google_login') }}";

        // Theme toggle functionality
        document.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.querySelector('.theme-toggle').textContent = "Light Mode";
            }
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            let btn = document.querySelector('.theme-toggle');
            btn.textContent = document.body.classList.contains('dark-mode') ? "Light Mode" : "Dark Mode";
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
    </script>
    <script type="module" src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
</body>
</html>
